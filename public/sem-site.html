<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Sem site</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f5;color:#3f3f46;
font:16px/1.6 system-ui,sans-serif;padding:24px;text-align:center}
.card{max-width:420px}h1{font-size:1.35rem;margin:0 0 .6rem;color:#18181b}
.tag{display:inline-block;background:#e4e4e7;border-radius:999px;padding:.35rem .9rem;font-size:.8rem;margin-bottom:1rem}
p{margin:.4rem 0}b{color:#18181b}
</style></head><body><div class="card">
<div class="tag">Antes</div>
<h1 id="n">Este negócio não tem site</h1>
<p id="o"></p>
<p style="margin-top:1.2rem;font-size:.9rem">Quem procura no Google encontra só o perfil do Maps, sem nenhuma página que o negócio controle.</p>
</div>
<script>
var q=new URLSearchParams(location.search);
if(q.get('nome')) document.getElementById('n').textContent=q.get('nome')+' não tem site próprio';
document.getElementById('o').innerHTML= q.get('onde') ? 'Hoje a presença on-line da casa é: <b>'+q.get('onde')+'</b>' : '';
</script></body></html>
